name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: os-taxonomy-beijing
      - uses: actions/checkout@v4
        with:
          repository: withmarbleapp/os-taxonomy
          ref: 96a7933754af672e1bfdbf7ecb05c325860c6e0d
          path: os-taxonomy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static browser
        working-directory: os-taxonomy-beijing
        run: npm run build:static -- --upstream ../os-taxonomy --out _site --base-path /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: os-taxonomy-beijing/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
