<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习图谱 · Beijing Skill Taxonomy</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>📚 学习图谱</h1>
        <p class="subtitle">Beijing Skill Taxonomy</p>
        <div class="search-box">
          <input type="text" id="search" placeholder="🔍 搜索微主题…" autocomplete="off">
        </div>
      </div>
      <div class="sidebar-stats" id="stats"><span class="stat-loading">加载中…</span></div>
      <div class="dimension-bar" id="dimension-bar"><span class="dimension-label">维度</span></div>
      <div class="filter-bar">
        <span class="filter-label">年龄</span>
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="young" title="4-7 岁:学前~小学低年级">低龄</button>
        <button class="filter-btn" data-filter="mid" title="8-10 岁:小学中年级">中龄</button>
        <button class="filter-btn" data-filter="old" title="11 岁以上:小学高年级~初中">高龄</button>
      </div>
      <nav class="tree" id="tree"><p class="tree-loading">加载中…</p></nav>
      <div class="sidebar-footer">
        <a href="https://github.com/withmarbleapp/os-taxonomy" target="_blank">上游 Marble</a><span>·</span><span>v1-zh</span>
      </div>
    </aside>
    <main class="content">
      <section id="overview" class="view active">
        <div class="overview-hero">
          <h2>北京版技能分类</h2>
          <p class="hero-desc" id="hero-desc">把面向英语世界小学生的「学习图谱」翻译为中文,对齐中国教育部课程标准(小学/初中 2022 版 + 高中 2017 版 2020 修订),覆盖小学/初中/高中全学段。</p>
        </div>
        <div class="overview-stats" id="overview-stats"></div>
        <div class="overview-section">
          <h3>学科概览</h3>
          <div class="subject-cards" id="subject-cards"></div>
        </div>
        <div class="overview-section">
          <h3>许可证</h3>
          <div class="license-info"><table>
            <tr><th>数据库</th><td>ODbL 1.0 — share-alike,商用友好</td></tr>
            <tr><th>文本</th><td>CC BY-SA 4.0 — 署名 + share-alike</td></tr>
            <tr><th>课标编号</th><td>codes-only,不收录原文</td></tr>
          </table></div>
        </div>
      </section>
      <section id="list" class="view">
        <div class="list-header">
          <button class="back-btn" onclick="showOverview()">← 返回</button>
          <h2 id="list-title">微主题</h2>
          <span class="list-count" id="list-count"></span>
        </div>
        <div class="topic-grid" id="topic-grid"></div>
      </section>
      <section id="detail" class="view">
        <div class="detail-header">
          <button class="back-btn" id="detail-back">← 返回</button>
          <div class="detail-badges" id="detail-badges"></div>
        </div>
        <div class="detail-body" id="detail-body"></div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
